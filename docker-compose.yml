version: "3.9"

services:
  aegis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-noc-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - noc-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aegis-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - noc-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aegis-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - noc-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aegis-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - noc-net

  loki:
    image: grafana/loki:3.1.0
    container_name: aegis-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - noc-net

  nginx:
    image: nginx:1.27-alpine
    container_name: aegis-nginx-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - aegis-app
    networks:
      - noc-net

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  noc-net:
    driver: bridge
