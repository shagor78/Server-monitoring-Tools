global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "instance", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h
  receiver: "aegis-noc-webhook"

receivers:
  - name: "aegis-noc-webhook"
    webhook_configs:
      - url: "http://aegis-app:3000/api/v1/alerts"
        send_resolved: true
